name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Check module hygiene
        run: go mod tidy -diff

      - uses: extractions/setup-just@v4

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test and verify the user cache is unchanged
        run: |
          cache_root="${XDG_CACHE_HOME:-$HOME/Library/Caches}/better-fonts"
          snapshot_cache() {
            if [ -e "$cache_root" ]; then
              find "$cache_root" -ls
            fi
          }
          before="$(snapshot_cache)"
          just test
          after="$(snapshot_cache)"
          if [ "$before" != "$after" ]; then
            echo 'Tests modified the user font cache' >&2
            exit 1
          fi
